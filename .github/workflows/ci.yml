name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ ninja-build python3-pip
          python3 -m pip install --break-system-packages "cmake>=3.28"

      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/ci --config Debug

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ ninja-build python3-pip
          python3 -m pip install --break-system-packages "cmake>=3.28" "gcovr>=8"

      - name: Configure tests
        run: >
          cmake -S . -B build/ci-tests -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build tests
        run: cmake --build build/ci-tests --config Debug

      - name: Run unit tests
        run: ctest --test-dir build/ci-tests --output-on-failure --build-config Debug

      - name: Generate gcov coverage report
        run: |
          mkdir -p coverage
          gcovr --root . \
            --filter '^(engine|ai|app)/' \
            --print-summary \
            --txt-metric branch \
            --html-details coverage/index.html \
            --html-title "Minesweeper coverage" \
            --xml-pretty \
            --xml coverage/coverage.xml \
            build/ci-tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/